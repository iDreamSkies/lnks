name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}${{ matrix.label && format(' · {0}', matrix.label) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
        extensions: ['pdo_sqlite']
        include:
          # Minimal build: proves lnks needs neither mbstring nor ctype
          - php: '8.0'
            extensions: 'pdo_sqlite, :mbstring, :ctype'
            label: 'no mbstring/ctype'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          coverage: none
          tools: none

      - name: Environment
        run: |
          php -v
          php -m | grep -iE 'pdo_sqlite|mbstring|ctype' || true

      - name: Syntax check
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Tests
        run: php tests/run.php
